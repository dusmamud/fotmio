[package]
name = "fotmio-desktop"
version = "0.1.0"
description = "Fotmio – Photo Compressor & Image Resizer (desktop shell)"
authors = ["Dusrel"]
edition = "2021"

# Tauri 2 ka recommended library target — main.rs isi lib ke run() ko call karta hai.
[lib]
name = "fotmio_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
