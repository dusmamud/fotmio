name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 9.15.0
  NODE_VERSION: 24

jobs:
  # ---------------------------------------------------------------------------
  # Test — sab builds ke liye GATE
  # Is job ke pass hue bina web, Android, iOS ya desktop build start nahi hoga.
  # ---------------------------------------------------------------------------
  test:
    name: Test (gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust (stable + wasm32 target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Run engine tests
        working-directory: engine
        run: cargo test

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check UI (svelte-check + TypeScript)
        run: pnpm --filter fotmio-ui check

  # ---------------------------------------------------------------------------
  # Web (PWA) — engine WASM + UI build; sirf test pass hone ke baad
  # ---------------------------------------------------------------------------
  web:
    name: Web (PWA)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Setup Rust (wasm32 target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build engine (WASM) + UI
        run: pnpm build

      - name: Upload web dist
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: ui/dist
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Deploy Web — Cloudflare Pages
  # IMPORTANT: Is job ke liye GitHub repo ke Settings > Secrets and variables >
  # Actions me ye do repository secrets add karne lazmi hain:
  #   CLOUDFLARE_ACCOUNT_ID
  #   CLOUDFLARE_API_TOKEN
  # Agar ye secrets missing honge to deploy-web job fail ho jayegi.
  # ---------------------------------------------------------------------------
  deploy-web:
    name: Deploy Web (Cloudflare Pages)
    runs-on: ubuntu-latest
    needs: web
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Download web dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: ui/dist

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          projectName: fotmio
          directory: ui/dist
          branch: main

  # ---------------------------------------------------------------------------
  # Android — Capacitor sync + Gradle AAB; sirf test pass hone ke baad
  # NOTE: Ye job tabhi asal build karega jab mobile/android/ native project
  # repo me committed hoga (README-mobile.md ke steps se generate hota hai).
  # Uske pehle native-check step build steps ko gracefully skip kar dega.
  # ---------------------------------------------------------------------------
  android:
    name: Android (AAB)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Check native Android project
        id: native
        run: |
          if [ -d "mobile/android" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning::mobile/android maujood nahi hai — pehle 'cap add android' chala kar native project commit karo. Build steps skip ho rahe hain."
          fi

      - name: Setup JDK 17
        if: steps.native.outputs.exists == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        if: steps.native.outputs.exists == 'true'
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        if: steps.native.outputs.exists == 'true'
        run: pnpm install --frozen-lockfile

      - name: Setup Rust (wasm32 target)
        if: steps.native.outputs.exists == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup wasm-pack
        if: steps.native.outputs.exists == 'true'
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - name: Build engine (WASM) + UI
        if: steps.native.outputs.exists == 'true'
        run: pnpm build

      - name: Capacitor sync (Android)
        if: steps.native.outputs.exists == 'true'
        working-directory: mobile
        run: pnpm exec cap sync android

      - name: Build release AAB
        if: steps.native.outputs.exists == 'true'
        working-directory: mobile/android
        run: ./gradlew bundleRelease

      - name: Upload AAB
        if: steps.native.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # iOS — Capacitor sync + Xcode unsigned archive; sirf test pass hone ke baad
  # NOTE: Android ki tarah mobile/ios/ committed hone par hi asal build hoga.
  # Signing abhi configure nahi hai — job sirf unsigned .xcarchive banata hai.
  # ---------------------------------------------------------------------------
  ios:
    name: iOS (unsigned archive)
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check native iOS project
        id: native
        run: |
          if [ -d "mobile/ios" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning::mobile/ios maujood nahi hai — pehle Mac par 'cap add ios' chala kar native project commit karo. Build steps skip ho rahe hain."
          fi

      - name: Install dependencies
        if: steps.native.outputs.exists == 'true'
        run: pnpm install --frozen-lockfile

      - name: Setup Rust (wasm32 target)
        if: steps.native.outputs.exists == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup wasm-pack
        if: steps.native.outputs.exists == 'true'
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - name: Build engine (WASM) + UI
        if: steps.native.outputs.exists == 'true'
        run: pnpm build

      - name: Capacitor sync (iOS)
        if: steps.native.outputs.exists == 'true'
        working-directory: mobile
        run: pnpm exec cap sync ios

      - name: Xcode archive (unsigned)
        if: steps.native.outputs.exists == 'true'
        working-directory: mobile
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/Fotmio.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Upload archive
        if: steps.native.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcarchive
          path: ${{ runner.temp }}/Fotmio.xcarchive
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Desktop — Tauri 2 (Windows + macOS), tauri-action standard pattern.
  # Dono jobs sirf test pass hone ke baad chalegi. beforeBuildCommand
  # (tauri.conf.json) khud root `pnpm build` chala kar engine WASM + ui/dist
  # taiyaar karta hai.
  # ---------------------------------------------------------------------------
  desktop-windows:
    name: Desktop (Windows)
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web (engine + UI)
        run: pnpm build

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-bundles
          path: desktop/src-tauri/target/release/bundle/**
          if-no-files-found: warn

  desktop-macos:
    name: Desktop (macOS)
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Setup Rust (universal targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,aarch64-apple-darwin,x86_64-apple-darwin

      - name: Setup wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web (engine + UI)
        run: pnpm build

      - name: Build Tauri app (universal)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          args: --target universal-apple-darwin

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-bundles
          path: desktop/src-tauri/target/universal-apple-darwin/release/bundle/**
          if-no-files-found: warn
