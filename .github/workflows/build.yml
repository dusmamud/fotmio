# =============================================================================
# Fotmio CI — test gate, platform builds, artifacts, Pages deploy, releases
#
# Rules:
#   1. `test` job GATE hai — pass hue bina koi build start nahi hota.
#   2. Har build job apna artifact upload karta hai (if-no-files-found: error).
#      Artifact nahi bana to job FAIL — fake green nahi chalega.
#   3. Android/iOS jobs sirf tab chalte hain jab unka native project repo me
#      committed ho (detect job). Warna job SKIPPED dikhta hai, pass nahi.
#   4. Tag push (v*) par release job saare installers GitHub Release me
#      attach karta hai.
# =============================================================================
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 9.15.0
  NODE_VERSION: '24'

jobs:
  # ---------------------------------------------------------------------------
  # Detect — kaun se native mobile projects repo me maujood hain
  # ---------------------------------------------------------------------------
  detect:
    name: Detect · platform readiness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      android: ${{ steps.check.outputs.android }}
      ios: ${{ steps.check.outputs.ios }}
    steps:
      - uses: actions/checkout@v4

      - name: Check native projects
        id: check
        run: |
          if [ -d mobile/android ]; then echo "android=true" >> "$GITHUB_OUTPUT"; else echo "android=false" >> "$GITHUB_OUTPUT"; fi
          if [ -d mobile/ios ]; then echo "ios=true" >> "$GITHUB_OUTPUT"; else echo "ios=false" >> "$GITHUB_OUTPUT"; fi
          {
            echo "### Platform readiness"
            echo "- Android native project: $([ -d mobile/android ] && echo 'present' || echo 'missing — job skipped')"
            echo "- iOS native project: $([ -d mobile/ios ] && echo 'present' || echo 'missing — job skipped')"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Test — GATE: format, lint, unit tests, UI typecheck
  # ---------------------------------------------------------------------------
  test:
    name: Test · fmt + clippy + unit + UI check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine -> target

      - name: Rust format check
        working-directory: engine
        run: cargo fmt --check

      - name: Rust clippy (warnings = errors)
        working-directory: engine
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust unit tests
        working-directory: engine
        run: cargo test

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: UI typecheck (svelte-check + tsc)
        run: pnpm --filter fotmio-ui check

      - name: Summary
        if: always()
        run: |
          {
            echo "### Test gate"
            echo "- cargo fmt --check"
            echo "- cargo clippy --all-targets (-D warnings)"
            echo "- cargo test (engine)"
            echo "- svelte-check + tsc (UI)"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Web (PWA)
  # ---------------------------------------------------------------------------
  web:
    name: Web · PWA build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build engine (WASM) + UI
        run: pnpm build

      - name: Summary
        shell: bash
        run: |
          {
            echo "### Web build"
            echo "- dist size: $(du -sh ui/dist | cut -f1)"
            echo "- artifact: fotmio-web"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fotmio-web
          path: ui/dist
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Deploy Web — Cloudflare Pages (production)
  # Repo secrets chahiye: CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_API_TOKEN
  # ---------------------------------------------------------------------------
  deploy-web:
    name: Deploy · Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: web
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://fotmio.pages.dev
    steps:
      - name: Download web artifact
        uses: actions/download-artifact@v4
        with:
          name: fotmio-web
          path: ui/dist

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          projectName: fotmio
          directory: ui/dist
          branch: main

  # ---------------------------------------------------------------------------
  # Android — sirf jab mobile/android committed ho (warna job skipped)
  # ---------------------------------------------------------------------------
  android:
    name: Android · AAB + APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [test, detect]
    if: needs.detect.outputs.android == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build engine (WASM) + UI
        run: pnpm build

      - name: Capacitor sync (Android)
        working-directory: mobile
        run: pnpm exec cap sync android

      - name: Build AAB + APK (release)
        working-directory: mobile/android
        run: ./gradlew bundleRelease assembleRelease

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fotmio-android
          path: |
            mobile/android/app/build/outputs/bundle/release/*.aab
            mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  # iOS — sirf jab mobile/ios committed ho (warna job skipped). Unsigned.
  # ---------------------------------------------------------------------------
  ios:
    name: iOS · unsigned archive
    runs-on: macos-14
    timeout-minutes: 45
    needs: [test, detect]
    if: needs.detect.outputs.ios == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build engine (WASM) + UI
        run: pnpm build

      - name: Capacitor sync (iOS)
        working-directory: mobile
        run: pnpm exec cap sync ios

      - name: Xcode archive (unsigned)
        working-directory: mobile
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/Fotmio.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fotmio-ios
          path: ${{ runner.temp }}/Fotmio.xcarchive
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Desktop — Tauri 2, ek matrix job (Windows + macOS universal)
  # ---------------------------------------------------------------------------
  desktop:
    name: Desktop · ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            os: windows-latest
            rust-targets: wasm32-unknown-unknown
            args: ''
            bundle-path: desktop/src-tauri/target/release/bundle/**
          - platform: macOS
            os: macos-14
            rust-targets: wasm32-unknown-unknown,aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
            bundle-path: desktop/src-tauri/target/universal-apple-darwin/release/bundle/**
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          key: ${{ matrix.platform }}

      - name: Setup wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web (engine + UI)
        run: pnpm build

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          args: ${{ matrix.args }}

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: fotmio-desktop-${{ matrix.platform }}
          path: ${{ matrix.bundle-path }}
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Release — tag push (v*) par installers GitHub Release me attach
  # ---------------------------------------------------------------------------
  release:
    name: Release · GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [web, desktop]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: fotmio-*
          path: artifacts

      - name: Zip web build
        run: |
          cd artifacts/fotmio-web
          zip -r "../fotmio-web-${{ github.ref_name }}.zip" .
          cd ../..

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/fotmio-desktop-Windows/**/*.msi
            artifacts/fotmio-desktop-Windows/**/*.exe
            artifacts/fotmio-desktop-macOS/**/*.dmg
            artifacts/fotmio-web-${{ github.ref_name }}.zip
