<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563eb" />
    <meta
      name="description"
      content="Fotmio compresses and resizes photos to an exact target size — 100% offline. Your photos never leave your device."
    />
    <!-- PWA manifest: the file itself is provided by the platform wrappers (web/mobile/desktop). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Fotmio – Photo Compressor &amp; Image Resizer</title>
    <script>
      // Set the theme before first paint to avoid a flash of the wrong scheme.
      (function () {
        try {
          var stored = localStorage.getItem('fotmio-theme')
          var dark =
            stored === 'dark' ||
            (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
