[package]
name = "fotmio-engine"
version = "0.1.0"
edition = "2021"
description = "Fotmio – Photo Compressor & Image Resizer: Rust compression engine (bytes-in / bytes-out). Native (cdylib) + WASM."
license = "MIT"

# binaryen (wasm-opt) download is environment par nirbhar hai; build hermetic
# rakhne ke liye wasm-opt band hai (size optimization baad me CI par dekhenge).
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
image = "0.25"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "0.2"
kamadak-exif = "0.5"

# Native-only encoders (C libraries). WASM build me ye compile nahi hote;
# wahan image-crate fallback encoders use hote hain (dekho src/lib.rs + NOTES.md).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
mozjpeg = { version = "0.10", default-features = false }
webp = "0.3"
